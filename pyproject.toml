[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safesight-fl"
version = "0.1.0"
description = "Privacy-preserving workplace safety monitoring prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-dotenv>=1.0,<2",
    "streamlit>=1.49,<2",
    "numpy>=1.26,<3",
    "torch>=2.0,<3",
    "flwr>=1.39,<2",
    "opacus>=1.6,<2",
    "ultralytics>=8.3,<9",
    "opencv-python>=4.8,<5",
    "google-genai>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
